# ---------------------------------------------------------------- when stuck

[[stuck]]
problem = "I forget where the pieces are in the middle of a game."
advice = "You are skipping the checking habit. Do it every 5 moves, no exceptions, even when it feels unnecessary. If you still forget, go back to Phase 5 and follow games: they train exactly this."

[[stuck]]
problem = "I mix up squares, f6 with g6."
advice = "Layer 1 (the map) isn't automatic yet. Go back to the Phase 1 routine for 3 days. It isn't a step back: it is the base everything else stands on."

[[stuck]]
problem = "The knight confuses me."
advice = "Use the color trick (a knight always changes color) to check every move. Train more Phase 2 knight routes."

[[stuck]]
problem = "I get tired very quickly."
advice = "Normal in the first weeks. Shorten the sessions and train more often. Train when you are rested, not at 11 pm after a full day."

[[stuck]]
problem = "I have been stuck in a phase for more than a week."
advice = "Split the checkpoint into smaller goals. If the goal is 20 colors in a row, start with 10. Small, steady progress wins."

[[stuck]]
problem = "Blindfolded I play much worse than normally."
advice = "Expected. The gap shrinks with time. At first prefer simple positions and trades: the goal is to finish games, not to win them all."
