[[phases]]
number = 3
title = "Small positions"
goal = "Hold a whole position in your head, with few pieces, and calculate."
notes = """
Read the position once, out loud. Then recite it back piece by piece before looking for the move: the app hides the position and asks you to list both sides first.

Box method (rook endings): imagine the rook cutting the enemy king into a rectangular box. Each move, shrink the box or bring your king closer. You only need three things: where his king is, where yours is, and which line the rook cuts.

The checking habit: from here on, every 5 moves, answer where both kings are and which pieces (yours and his) are attacked and undefended. The app asks you in every training game.
"""
routine = [["knight_attacks_fast", 3], ["mate1_3_1", 5], ["mate2_3_2", 7], ["endgame_kr", 10]]

[[phases.exercises]]
id = "mate1_3_1"
title = "Exercise 3.1: mate in one (8 positions)"
type = "quiz"
checkpoint = true
recall = true
pass = {}
questions = [
  { kind = "mate1", position = "White: Kg6, Ra1. Black: Kg8.", note = "Ra8#: the rook checks along the 8th rank covering f8 and h8; the king on g6 covers f7, g7 and h7." },
  { kind = "mate1", position = "White: Kg6, Qe1. Black: Kh8.", note = "Qe8#: the queen checks along the 8th rank and covers g8; the king on g6 covers g7 and h7." },
  { kind = "mate1", position = "White: Kg1, Rd1, pawns f2, g2, h2. Black: Kg8, pawns f7, g7, h7.", note = "Rd8#: a back-rank mate; Black's own pawns trap the king." },
  { kind = "mate1", position = "White: Kf6, Qg1. Black: Kh8.", note = "Qg7#: the queen is protected by the king on f6." },
  { kind = "mate1", position = "White: Ka1, Ng5. Black: Kh8, Rg8, pawns g7, h7.", note = "Nf7#: smothered mate; g8, g7 and h7 are occupied by Black's own pieces and nothing can take the knight." },
  { kind = "mate1", position = "White: Kb6, Qc1. Black: Ka8.", note = "Qc8#: the queen covers the 8th rank; the king on b6 covers a7 and b7." },
  { kind = "mate1", position = "White: Kg1, Qh5, Bc4. Black: Ke8, Qd8, Bf8, pawns d7, f7.", note = "Qxf7#: the queen is protected by the bishop on c4; d7, d8 and f8 are occupied by Black's pieces and e7 is covered by the queen." },
  { kind = "mate1", position = "White: Kh1, Ra7, Rb1. Black: Kh8.", note = "Rb8#: the rook on a7 cuts the 7th rank; the other rook mates on the 8th." },
]

[[phases.exercises]]
id = "mate2_3_2"
title = "Exercise 3.2: mate in two (pass with 4 of 5)"
type = "quiz"
checkpoint = true
recall = true
pass = { min_correct = 4 }
questions = [
  { kind = "mate2", position = "White: Kf6, Ra2. Black: Kg8.", hint = "The first move is not a check.", note = "1.Rh2! The king can only go to f8 (h8 is covered by the rook; f7, g7, h7 by the king). 1...Kf8 2.Rh8#." },
  { kind = "mate2", position = "White: Kh1, Ra6, Rb5. Black: Kg8.", hint = "The rook staircase.", note = "1.Rb7 (or 1.Ra7): one rook cuts the 7th rank, the other mates on the 8th." },
  { kind = "mate2", position = "White: Kg1, Qd2, Rd1, pawns f2, g2, h2. Black: Kg8, Qc7, Rd8, pawns f7, g7, h7.", note = "1.Qxd8+! Qxd8 2.Rxd8#: the queen removes the defender, the rook gives the back-rank mate." },
  { kind = "mate2", position = "White: Kg1, Qc4, Bb3, Ng5, pawns f2, g2, h2. Black: Kh8, Rf8, pawns g7, h7.", hint = "Smothered mate.", note = "1.Qg8+!! Rxg8 2.Nf7#: the king can't take the queen because the bishop on b3 protects it; after Rxg8 the king is boxed in by its own pieces." },
  { kind = "mate2", position = "White: Kg1, Re1, Re2, pawns f2, g2, h2. Black: Kg8, Ra8, Re8, pawns f7, g7, h7.", note = "1.Rxe8+! Rxe8 2.Rxe8#: two rooks on the same file beat one." },
]

