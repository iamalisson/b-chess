[[phases]]
number = 2
title = "One piece at a time"
goal = "Move pieces in your head without a board."
notes = """
A knight always changes color: if it stands on a light square, every square it attacks is dark. Use that to check your answers.

On an empty board a rook always attacks 14 squares. A knight attacks between 2 (in a corner) and 8 (in the centre).

Knight route parity: if start and target have the same color, the number of moves is even; if different, odd.
"""
routine = [["colors_random", 2], ["diagonals_random", 1], ["attacks_random", 7], ["routes_random", 5], ["scholars_mate", 5]]

