[[phases.exercises]]
id = "relations_2_3"
title = "Exercise 2.3: relations"
type = "quiz"
pass = {}
questions = [
  { kind = "ask", position = "White: Qd1. Black: Kh5.", prompt = "White queen on d1, black king on h5. Is it check?", answer = { yes_no = true }, verify = "check:b", note = "Yes: the diagonal d1-e2-f3-g4-h5." },
  { kind = "ask", position = "White: Bc4.", prompt = "White bishop on c4. Does it attack f7?", answer = { yes_no = true }, verify = "attacks:c4:f7", note = "c4-d5-e6-f7." },
  { kind = "ask", position = "White: Qh5.", prompt = "White queen on h5. Does it attack f7?", answer = { yes_no = true }, verify = "attacks:h5:f7", note = "h5-g6-f7." },
  { kind = "ask", position = "White: Nc7. Black: Ke8, Ra8.", prompt = "White knight on c7, black king on e8, black rook on a8. What is happening?", options = ["fork", "pin", "skewer", "discovered check"], answer = { choice = "fork" }, note = "The knight checks the king and attacks the rook at the same time." },
  { kind = "ask", position = "White: Nc7. Black: Ke8, Ra8.", prompt = "Same position: list the squares of the black pieces the knight attacks.", answer = { squares = "a8 e8" }, verify = "attacked_by:c7" },
  { kind = "ask", position = "White: Ra1. Black: Ka8.", prompt = "White rook on a1, black king on a8, nothing between them. Is it check?", answer = { yes_no = true }, verify = "check:b", note = "Yes: the a-file is open." },
  { kind = "ask", position = "White: Bg5. Black: Nf6, Qd8.", prompt = "White bishop on g5, black knight on f6, black queen on d8. What is the bishop doing?", options = ["fork", "pin", "skewer", "discovered check"], answer = { choice = "pin" }, note = "The knight can't move without exposing the queen (g5-f6-e7-d8)." },
  { kind = "ask", position = "White: Ke1. Black: Qh4.", prompt = "Black queen on h4, white king on e1, nothing on f2 or g3. Is it check?", answer = { yes_no = true }, verify = "check:w", note = "Yes: the diagonal h4-g3-f2-e1." },
  { kind = "ask", position = "White: Nf3, Qd1. Black: Bg4, pawn e5.", prompt = "White knight on f3, white queen on d1, black pawn on e5, black bishop on g4. Why can't the knight safely take on e5?", options = ["it is pinned to the queen", "e5 is defended by a pawn", "a knight can't reach e5 from f3"], answer = { choice = "it is pinned to the queen" }, note = "If the knight leaves f3, the bishop takes the queen on d1. This is exactly the idea of Légal's mate." },
]

