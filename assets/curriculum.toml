# Blindfold chess: from zero to a cup of coffee.
# A 10-week course, 15-30 minutes a day, translated from "Xadrez às Cegas" (v2).
#
# Facts the app can compute (square colors, diagonals, attacked squares, knight routes,
# mates) are computed. Position-dependent answers carry a `verify` rule that the test
# suite checks against the real board:
#   holds:X                  the answer square holds piece X (uppercase white, lowercase black)
#   holds_choice:SQ          the chosen piece name is the piece standing on SQ
#   pieces:X                 the answer (squares or count) matches every square holding piece X
#   check:w|b                the answer says whether that side's king is in check
#   checkers                 the answer (squares or count) matches the pieces giving check
#   flight                   the answer lists the checked king's flight squares
#   attackers:SQ:w|b         the answer (squares or count) matches that side's pieces attacking SQ
#   attacked_by:SQ           the answer lists the enemy pieces the piece on SQ attacks
#   attacks:FROM:TO          the answer says whether the piece on FROM attacks TO
#   between:A:B              the answer lists the empty squares between A and B
#   between:A:B:occupied     the answer lists the occupied squares between A and B

# ---------------------------------------------------------------- phases

[[phases]]
number = 0
title = "Diagnostic"
goal = "Measure where you start. Answer without looking and without hurry; you will retake this test at graduation."
notes = """
Blindfold players don't keep a photo of the board. They keep a map of squares (each one's color, diagonals and neighbours known by heart) and a living list of relations (who attacks what, where the kings are, what is loose).

The course trains three layers, in order: the map, movement, and position memory. Skipping layers is the most common reason people give up.

Rules: train a little every day; say moves out loud; don't check in the middle of an exercise; only advance after passing the checkpoint; when you make a mistake, rebuild from the last point you were sure of; start each day with a short warm-up from earlier phases.
"""
routine = [["diagnostic", 5]]

[[phases.exercises]]
id = "diagnostic"
title = "Diagnostic test"
type = "quiz"
checkpoint = true
pass = { min_correct = 0 }
questions = [
  { kind = "color", square = "f6" },
  { kind = "diagonal_squares", from = "c1", to = "h6" },
  { kind = "attacks", piece = "N", square = "e4" },
  { kind = "ask", moves = "1.e4 e5 2.Nf3 Nc6 3.Bc4", prompt = "After 1.e4 e5 2.Nf3 Nc6 3.Bc4, which black piece does the white bishop aim at? Give its square.", answer = { square = "f7" }, verify = "holds:p", note = "The f7 pawn, on the diagonal c4-d5-e6-f7." },
  { kind = "mate1", position = "White: Kg6, Ra1. Black: Kg8.", note = "Ra8#." },
]

[[phases]]
number = 1
title = "The map"
goal = "The empty board becomes automatic knowledge. No pieces yet."
notes = """
Color trick: turn the file into a number (a=1 ... h=8) and add the rank. Even sum = dark, odd sum = light. Use it as a crutch and drop it once the answer comes by itself.

Anchors: a1 is dark, h1 is light. The queen starts on her own color. d4 and e5 are dark, e4 and d5 light. The long diagonal a1-h8 is all dark; h1-a8 all light.

Diagonals to know like street names: a1-h8, h1-a8, a2-g8 (the Italian bishop), b1-h7 (the attack on h7), c1-h6, f1-a6, e1-a5.

Diagonal test: two squares share a diagonal when the file difference equals the rank difference.

Practise the board from both sides: blindfold, you must know it with White and with Black at the bottom.
"""
routine = [["coordinates_white", 3], ["coordinates_black", 2], ["colors_random", 4], ["diagonals_random", 4], ["walk_random", 2]]

