[[phases]]
number = 7
title = "The cup of coffee"
goal = "Turn the effort into a habit, then graduate."
notes = """
Week plan: days 1-3, one blindfold game a day, going up a level after two wins in a row; days 4-5, a blindfold game against a person; day 6, review one of your blindfold games on a board and mark where you got confused, then train that kind of position; day 7, rest, or a classic game from memory for fun.

Graduation: retake the diagnostic and get everything right, fast; play a whole blindfold game of 30+ moves without getting lost and without an illegal move, answering "where is your knight?" at any moment.

Maintenance: 2-3 times a week, a blindfold game or a short game read from notation. Now and then, mate-in-2 problems read as written positions. To go further: faster time controls, stronger opponents, or two blindfold games at once.
"""
routine = [["daily_game", 25]]

