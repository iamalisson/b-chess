[[phases]]
number = 6
title = "Playing with training wheels"
goal = "Play whole games, first with help, then without."
notes = """
Step 1, invisible pieces: the board and its squares stay visible, the pieces don't. Play a low level, slowly.

Step 2, eyes off the board: a normal blindfold game. Answer the checking questions every 5 moves.

Step 3, recovery: when you get lost (it will happen), don't give up. Type `recall` to rebuild the position: list your pieces and his, then carry on. Recovering is as important a skill as not getting lost.

Tips: start with an opening you know well; prefer simple positions, trading pieces when in doubt; after the game, note the move where the position started to blur.
"""
routine = [["ghost_games", 25]]

